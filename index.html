<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 계산기 - Sales Calculator</title>
    <meta name="description" content="C4와 검은돈의 판매 금액을 정확하게 계산하는 전문 계산기. 실시간 계산 결과와 상세한 수익 분석을 제공합니다.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" data-testid="button-theme-toggle">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <div class="container">
        <div class="calculator-wrapper">
            <!-- Header -->
            <div class="header">
                <div class="header-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="2" width="16" height="20" rx="2"/>
                        <line x1="8" y1="6" x2="16" y2="6"/>
                        <line x1="8" y1="10" x2="16" y2="10"/>
                        <line x1="8" y1="14" x2="16" y2="14"/>
                        <line x1="8" y1="18" x2="10" y2="18"/>
                    </svg>
                </div>
                <h1 class="title">판매 계산기</h1>
                <p class="subtitle">C4와 검은돈의 개수를 입력하면 실시간으로 판매 금액이 계산됩니다</p>
            </div>

            <!-- Input Cards -->
            <div class="row g-4 mb-4">
                <!-- C4 Card -->
                <div class="col-12 col-md-6">
                    <div class="card hover-card" data-testid="card-c4">
                        <div class="card-header">
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-wrapper bg-primary-subtle">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="1" x2="12" y2="23"/>
                                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                                    </svg>
                                </div>
                                <div>
                                    <h5 class="card-title mb-1">C4</h5>
                                    <p class="card-subtitle mb-0">개당 ₩<span id="c4-price">400,000,000</span></p>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="c4-quantity" class="form-label">개수 입력</label>
                                <input type="number" class="form-control form-control-lg" id="c4-quantity" 
                                       placeholder="0" min="0" data-testid="input-c4-quantity">
                            </div>
                            <div id="c4-total-wrapper" class="result-wrapper" style="display: none;">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="text-muted">총액</span>
                                    <span class="result-amount text-primary" id="c4-total" data-testid="text-c4-total">₩0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Black Money Card -->
                <div class="col-12 col-md-6">
                    <div class="card hover-card" data-testid="card-black-money">
                        <div class="card-header">
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-wrapper bg-success-subtle">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                                        <path d="M7 15h0M2 9.5h20"/>
                                    </svg>
                                </div>
                                <div>
                                    <h5 class="card-title mb-1">검은돈</h5>
                                    <p class="card-subtitle mb-0">개당 ₩<span id="black-money-price">10,000</span></p>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="black-money-quantity" class="form-label">개수 입력</label>
                                <input type="number" class="form-control form-control-lg" id="black-money-quantity" 
                                       placeholder="0" min="0" data-testid="input-black-money-quantity">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Black Money Breakdown -->
            <div id="breakdown-card" class="card breakdown-card mb-4" style="display: none;" data-testid="card-breakdown">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <svg class="me-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="16" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        검은돈 수익 분석
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-12 col-md-6">
                            <div class="breakdown-item">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="text-muted">환전금액</span>
                                    <span class="badge bg-success-subtle text-success">70%</span>
                                </div>
                                <p class="breakdown-amount text-success mb-0" id="exchange-amount" data-testid="text-exchange-amount">₩0</p>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="breakdown-item">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="text-muted">수익금액</span>
                                    <span class="badge bg-warning-subtle text-warning">20%</span>
                                </div>
                                <p class="breakdown-amount text-warning mb-0" id="profit-amount" data-testid="text-profit-amount">₩0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="text-center mb-5">
                <button id="reset-btn" class="btn btn-outline-secondary btn-lg" data-testid="button-reset">
                    <svg class="me-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                    초기화
                </button>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p class="text-muted mb-0">모든 금액은 실시간으로 자동 계산됩니다</p>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
