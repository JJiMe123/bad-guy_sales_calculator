<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판매 계산기</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- 커스텀 CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container py-5 text-center">
    <h1 class="mb-5">💰 판매 계산기</h1>

    <div class="row g-4 justify-content-center">
      <!-- C4 계산기 -->
      <div class="col-md-5">
        <div class="card p-4">
          <h2 class="mb-3">C4 계산기</h2>
          <label>갯수 입력</label>
          <input type="number" id="c4Count" class="form-control mb-3" placeholder="갯수를 입력하세요">
          <button class="btn btn-success w-100" onclick="calculateC4()">💣 계산하기</button>
          <div id="c4Result" class="hidden mt-3 animate__animated">
            <p>총 금액: <span id="c4Total"></span>원</p>
          </div>
        </div>
      </div>

      <!-- 검은돈 계산기 -->
      <div class="col-md-5">
        <div class="card p-4">
          <h2 class="mb-3">검은돈 계산기</h2>
          <label>갯수 입력</label>
          <input type="number" id="blackMoneyCount" class="form-control mb-3" placeholder="갯수를 입력하세요">
          <button class="btn btn-success w-100" onclick="calculateBlackMoney()">💵 계산하기</button>
          <div id="blackMoneyResult" class="hidden mt-3 animate__animated">
            <!-- 결과는 JS에서 작성 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
