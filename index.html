<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판매 계산기</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <link rel="stylesheet" href="style.css?v=1">
</head>
<body class="bg-gray-900 flex flex-col items-center min-h-screen py-10">

  <h1 class="mb-8">💰 판매 계산기</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-11/12 max-w-5xl">
    <!-- C4 계산 카드 -->
    <div class="card p-6 rounded-2xl">
      <h2 class="mb-4">C4 계산기</h2>
      <div class="mb-3">
        <label class="form-label">갯수 입력</label>
        <input type="number" id="c4Count" class="form-control" placeholder="갯수를 입력하세요">
      </div>
      <button class="btn btn-success w-100 py-2 mt-2" onclick="calculateC4()">💣 계산하기</button>

      <div id="c4Result" class="hidden mt-4 animate__animated">
        <p class="text-lg font-semibold">총 금액: <span id="c4Total"></span>원</p>
      </div>
    </div>

    <!-- 검은돈 계산 카드 -->
    <div class="card p-6 rounded-2xl">
      <h2 class="mb-4">검은돈 계산기</h2>
      <div class="mb-3">
        <label class="form-label">갯수 입력</label>
        <input type="number" id="blackMoneyCount" class="form-control" placeholder="갯수를 입력하세요">
      </div>
      <button class="btn btn-success w-100 py-2 mt-2" onclick="calculateBlackMoney()">💵 계산하기</button>

      <div id="blackMoneyResult" class="hidden mt-4 animate__animated">
        <!-- 결과는 JS에서 동적으로 채워집니다 -->
      </div>
    </div>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>
