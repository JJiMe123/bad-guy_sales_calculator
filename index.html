<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>판매 계산기</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

  <h1 class="text-3xl font-bold text-blue-400 mb-8">💰 판매 계산기</h1>

  <div class="grid md:grid-cols-2 gap-6 w-full max-w-5xl">

    <!-- C4 카드 -->
    <div class="card bg-gray-800 shadow-lg rounded-2xl p-6 relative overflow-hidden">
      <h2 class="text-2xl font-bold mb-4 text-yellow-400">💣 C4 계산기</h2>
      <p class="text-gray-300 mb-2">단가: 400,000,000원</p>

      <div class="mb-4">
        <label for="c4Count" class="form-label">갯수</label>
        <input type="number" id="c4Count" class="form-control text-right font-bold" placeholder="갯수를 입력하세요">
      </div>

      <button id="c4CalcBtn" class="btn btn-warning w-full py-2 rounded-xl font-bold hover:scale-105 transition-all">
        💣 C4 계산하기
      </button>

      <!-- 결과 영역 -->
      <div id="c4Result" class="result hidden bg-gray-700 mt-4 rounded-xl p-4 text-left text-white"></div>
    </div>

    <!-- 검은돈 카드 -->
    <div class="card bg-gray-800 shadow-lg rounded-2xl p-6 relative overflow-hidden">
      <h2 class="text-2xl font-bold mb-4 text-green-400">🕶️ 검은돈 계산기</h2>
      <p class="text-gray-300 mb-2">단가: 10,000원</p>
      <p class="text-sm text-gray-400 mb-4">세부사항: 환전70% + 수익20% + 서버회수10%</p>

      <div class="mb-4">
        <label for="blackMoneyCount" class="form-label">갯수</label>
        <input type="number" id="blackMoneyCount" class="form-control text-right font-bold" placeholder="갯수를 입력하세요">
      </div>

      <button id="blackMoneyCalcBtn" class="btn btn-success w-full py-2 rounded-xl font-bold hover:scale-105 transition-all">
        🕶️ 검은돈 계산하기
      </button>

      <!-- 결과 영역 -->
      <div id="blackMoneyResult" class="result hidden bg-gray-700 mt-4 rounded-xl p-4 text-left text-white"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
